name: Deploy Pages con Secreto

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar sintaxis JS y ejecutar pruebas de seguridad
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const { execFileSync } = require("child_process");

            function walk(dir, extList, out = []) {
              for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
                if (ent.name === ".git" || ent.name === ".github" || ent.name === "node_modules" || ent.name === "tests") continue;
                const full = path.join(dir, ent.name);
                if (ent.isDirectory()) walk(full, extList, out);
                else if (extList.some(ext => ent.name.toLowerCase().endsWith(ext))) out.push(full);
              }
              return out;
            }

            const jsFiles = walk(".", [".js"]);
            for (const f of jsFiles) {
              execFileSync("node", ["--check", f], { stdio: "inherit" });
            }
            console.log(`✅ Sintaxis verificada en ${jsFiles.length} archivos JS.`);

            execFileSync("node", ["--test", "tests/security-and-core.test.js"], { stdio: "inherit" });
          '

      - name: Inyectar Config Pública y aplicar versionado anti-caché
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            sed -i "s|TU_CLIENT_ID_AQUI|${GOOGLE_CLIENT_ID}|g" js/config.js
          fi
          if [ -n "$MAPBOX_TOKEN" ]; then
            sed -i "s|TU_MAPBOX_TOKEN_AQUI|${MAPBOX_TOKEN}|g" js/config.js
          fi
          node --check js/config.js

          node -e '
            const fs = require("fs");
            const path = require("path");

            function walk(dir, extList, out = []) {
              for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
                if (ent.name === ".git" || ent.name === ".github" || ent.name === "node_modules" || ent.name === "tests") continue;
                const full = path.join(dir, ent.name);
                if (ent.isDirectory()) walk(full, extList, out);
                else if (extList.some(ext => ent.name.toLowerCase().endsWith(ext))) out.push(full);
              }
              return out;
            }

            const ver = (process.env.SHORT_SHA || Date.now().toString()).slice(0, 8);
            const htmlFiles = walk(".", [".html"]);
            for (const h of htmlFiles) {
              let content = fs.readFileSync(h, "utf8");
              content = content.replace(
                /(<(?:script|link)\b[^>]*?\b(?:src|href)=["\x27])((?!https?:\/\/|data:|#)[^"\x27?#]+?\.(?:js|css))(?:\?[^"\x27]*)?(["\x27])/gi,
                `$1$2?v=${ver}$3`
              );
              fs.writeFileSync(h, content, "utf8");
            }
            console.log(`✅ Versionado ?v=${ver} aplicado en ${htmlFiles.length} archivos HTML.`);
          '

      - name: Limpiar archivos internos antes de publicar
        run: |
          rm -rf .git .github api tests vercel.json .gitignore .vercelignore .gitattributes "pages/movilidad/mis rutas"
          find . -type f \( -name "*.xlsx" -o -name "*.xls" -o -name "*.xlsm" -o -name "*.xlsb" -o -name "*.csv" -o -name "*.txt" -o -name "*.md" \) -delete

      - name: Configurar Pages
        uses: actions/configure-pages@v4

      - name: Subir archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Esperar indexación del artefacto en GitHub
        run: sleep 5

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
