<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://cdn.sheetjs.com https://unpkg.com https://accounts.google.com https://apis.google.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://oauth2.googleapis.com https://accounts.google.com https://*.gstatic.com https://api.mapbox.com https://*.mapbox.com https://router.project-osrm.org https://*.basemaps.cartocdn.com https://cdn.jsdelivr.net https://unpkg.com https://fonts.googleapis.com https://cdnjs.cloudflare.com; frame-src 'self' https://accounts.google.com https://content.googleapis.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';">
  <title>Lector de Fórmulas Google Sheets (v2)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔎</text></svg>">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" integrity="sha384-EnyY0/GSHQGSxSgMwaIPzSESbqoOLSexfnSMN2AP+39Ckmn92stwABZynq1JyzdT" crossorigin="anonymous"></script>
  <style>
    body { font-family: system-ui, sans-serif; padding: 30px; background: #f8fafc; color: #333; line-height: 1.5; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    h2 { color: #1e293b; margin-top: 0; display: flex; align-items: center; gap: 10px; }
    .drop-zone { 
      border: 2px dashed #3b82f6; padding: 40px; text-align: center; 
      border-radius: 8px; background: #eff6ff; cursor: pointer; 
      margin-bottom: 20px; transition: all 0.2s; font-size: 1.1rem; font-weight: 500; color: #1d4ed8;
    }
    .drop-zone:hover { background: #dbeafe; }
    textarea { width: 100%; height: 400px; font-family: 'JetBrains Mono', monospace; padding: 15px; border: 1px solid #cbd5e1; border-radius: 8px; background: #f1f5f9; white-space: pre; overflow-wrap: normal; overflow-x: scroll; box-sizing: border-box; }
    button { background: #10b981; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: background 0.2s; }
    button:hover { background: #059669; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🤖 Extractor Inteligente v2 (Traducido)</h2>
    <p>Esta versión escanea <b>todas las filas de tu Excel</b>, saltándose los espacios en blanco para encontrar todas tus tablas y fórmulas sin importar dónde estén ubicadas.</p>
    
    <div class="drop-zone" id="drop-zone">
      📁 Haz clic aquí para seleccionar tu archivo Excel
      <input type="file" id="file-input" style="display:none" accept=".xlsx, .xls, .xlsm">
    </div>

    <button id="copy-btn" style="display:none; margin-bottom: 15px;">📋 Copiar Resultado para la IA</button>
    <textarea id="output" placeholder="El mapa completo de tus hojas y fórmulas aparecerá aquí..."></textarea>
  </div>

  <script src="lector.js"></script>
</body>
</html>
